# Every PR must be green on all four jobs before it merges (docs/agent-workflow.md §6).
# No Docker: services (PostgreSQL, later QLever) are installed natively on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAE_TEST_DATABASE_URL: postgresql+asyncpg://lae:lae@localhost:5432/lae_test
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL 16 + pgvector from PGDG, started natively (.github/actions/setup-postgres).
      - name: PostgreSQL
        uses: ./.github/actions/setup-postgres
        with:
          database: lae_test

      # Phase 1 integration tests: install QLever natively here (no Docker), build a small
      # index, start the server with --persist-updates on localhost:7010, and export
      # LAE_QLEVER_URL / LAE_QLEVER_UPDATE_URL for pytest.

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: uv sync
        working-directory: backend
        run: uv sync --locked

      - name: ruff check
        working-directory: backend
        run: uv run --locked ruff check --output-format=github .

      - name: ruff format --check
        working-directory: backend
        run: uv run --locked ruff format --check .

      - name: mypy
        working-directory: backend
        run: uv run --locked mypy src

      - name: pytest
        working-directory: backend
        run: uv run --locked pytest -q -rs

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      # src/api/schema.d.ts is generated from the backend's OpenAPI document; regenerate it with
      # `corepack pnpm api:generate` whenever an endpoint changes.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: API types are up to date (api:check)
        run: corepack pnpm api:check

      - name: lint (eslint, i18next/no-literal-string, logical CSS)
        run: corepack pnpm lint

      - name: typecheck
        run: corepack pnpm typecheck

      - name: prettier
        run: corepack pnpm format:check

      - name: vitest
        run: corepack pnpm test

  # Playwright + axe against the production build in `vite preview`, proxying the API paths to a
  # real `lae api` (started by playwright.config.ts with LAE_DEV_USER and LAE_ENV=test) on a
  # migrated native PostgreSQL.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAE_DATABASE_URL: postgresql+asyncpg://lae:lae@localhost:5432/lae_e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: PostgreSQL
        uses: ./.github/actions/setup-postgres
        with:
          database: lae_e2e

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: uv sync
        working-directory: backend
        run: uv sync --locked

      - name: Migrate the e2e database
        working-directory: backend
        run: uv run --locked lae migrate

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      - name: Read the Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(corepack pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: corepack pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: corepack pnpm exec playwright install-deps chromium

      - name: build
        run: corepack pnpm build

      - name: Playwright + axe
        run: corepack pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  config:
    name: config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: Validate profiles/ against their JSON schemas
        run: uv run --locked --project backend python scripts/validate_profiles.py

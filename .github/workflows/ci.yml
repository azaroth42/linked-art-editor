# Every PR must be green on all five jobs before it merges (docs/agent-workflow.md §6).
# No Docker: services (PostgreSQL, later QLever) are installed natively on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  FORCE_COLOR: "1"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAE_TEST_DATABASE_URL: postgresql+asyncpg://lae:lae@localhost:5432/lae_test
    steps:
      - uses: actions/checkout@v7

      # PostgreSQL 16 + pgvector from PGDG, started natively (.github/actions/setup-postgres).
      - name: PostgreSQL
        uses: ./.github/actions/setup-postgres
        with:
          database: lae_test

      # QLever is not installed here: the tests that need it skip. The sync worker's QLever
      # tests run in the `sync-integration` job below.

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: uv sync
        working-directory: backend
        run: uv sync --locked

      - name: ruff check
        working-directory: backend
        run: uv run --locked ruff check --output-format=github .

      - name: ruff format --check
        working-directory: backend
        run: uv run --locked ruff format --check .

      - name: mypy
        working-directory: backend
        run: uv run --locked mypy src

      # tests/crdt/test_y_websocket.py runs the browser's own Yjs and y-websocket in Node against
      # crdt-ws; without the frontend's modules it would be skipped.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Locate the pnpm store
        working-directory: frontend
        run: echo "PNPM_STORE=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install (for the y-websocket wire test)
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile

      - name: pytest
        working-directory: backend
        run: uv run --locked pytest -q -rs

  # The sync worker against a real QLever 0.6.0 (Phase 1 Step 1.11, docs/contracts/1.11-sync-worker.md
  # §5). QLever is the Homebrew tap the development machine uses (deploy/QLEVER_VERSION), whose
  # binary is macOS arm64 only, hence macos-15. The tap is pinned to the commit that has
  # qlever 0.6.0_1; a step fails unless qlever-server reports v0.6.0. PostgreSQL and pgvector
  # come from Homebrew too. No Docker (ADR-0017). Runs every test in tests/sync that needs a
  # database or QLever; with LAE_REQUIRE_QLEVER=1 a missing QLever fails instead of skipping.
  sync-integration:
    name: sync-integration
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      QLEVER_TAP_COMMIT: 205cc9d5183fd669c227e7ac7e1dbd0164573dd6 # qlever 0.6.0_1, 2026-08-24
      LAE_TEST_DATABASE_URL: postgresql+asyncpg://lae:lae@localhost:5432/lae_test
      LAE_TEST_QLEVER_PORT: "7024"
      LAE_REQUIRE_QLEVER: "1"
    steps:
      - uses: actions/checkout@v7

      - name: QLever 0.6.0 (Homebrew tap qlever-dev/qlever, pinned)
        run: |
          brew tap qlever-dev/qlever
          git -C "$(brew --repository qlever-dev/qlever)" fetch --quiet origin "$QLEVER_TAP_COMMIT"
          git -C "$(brew --repository qlever-dev/qlever)" checkout --quiet "$QLEVER_TAP_COMMIT"
          # Homebrew refuses formulae of a third-party tap until it is trusted.
          brew trust qlever-dev/qlever
          brew install qlever-dev/qlever/qlever
          qlever-server --version
          qlever-index --version
          qlever --version

      - name: QLever is v0.6.0
        run: |
          version="$(qlever-server --version)"
          echo "$version"
          case "$version" in
            *"v0.6.0"*) ;;
            *) echo "::error::expected qlever-server v0.6.0, got: $version"; exit 1 ;;
          esac

      - name: PostgreSQL 18 and pgvector (Homebrew)
        run: |
          brew install postgresql@18 pgvector
          PG_BIN="$(brew --prefix postgresql@18)/bin"
          echo "$PG_BIN" >> "$GITHUB_PATH"
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/pgdata" -U postgres --auth=trust --encoding=UTF8 --locale=C
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/pgdata" -l "$RUNNER_TEMP/postgres.log" \
            -o "-p 5432 -k $RUNNER_TEMP" -w start
          "$PG_BIN/psql" -v ON_ERROR_STOP=1 -h localhost -U postgres -d postgres \
            -c "CREATE ROLE lae LOGIN SUPERUSER PASSWORD 'lae'" \
            -c "CREATE DATABASE lae_test OWNER lae"
          PGPASSWORD=lae "$PG_BIN/psql" -v ON_ERROR_STOP=1 -h localhost -U lae -d lae_test \
            -f "$GITHUB_WORKSPACE/deploy/postgres/init.sql"
          PGPASSWORD=lae "$PG_BIN/psql" -h localhost -U lae -d lae_test -Atc \
            "SELECT extname || ' ' || extversion FROM pg_extension ORDER BY 1"

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: uv sync
        working-directory: backend
        run: uv sync --locked

      - name: pytest -m integration tests/sync
        working-directory: backend
        run: uv run --locked pytest -m integration tests/sync -q -rs

      - name: QLever and PostgreSQL logs
        if: failure()
        run: |
          tail -n 100 "$RUNNER_TEMP/postgres.log" || true
          find "$RUNNER_TEMP" /private/var/folders -name '*.server-log.txt' -newer "$GITHUB_WORKSPACE" \
            -exec tail -n 100 {} \; 2>/dev/null || true

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      # src/api/schema.d.ts is generated from the backend's OpenAPI document; regenerate it with
      # `corepack pnpm api:generate` whenever an endpoint changes.
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: API types are up to date (api:check)
        run: corepack pnpm api:check

      - name: lint (eslint, i18next/no-literal-string, logical CSS)
        run: corepack pnpm lint

      - name: typecheck
        run: corepack pnpm typecheck

      - name: prettier
        run: corepack pnpm format:check

      - name: vitest
        run: corepack pnpm test

  # Playwright + axe against the production build in `vite preview`, proxying the API paths to a
  # real `lae api` (started by playwright.config.ts with LAE_DEV_USER and LAE_ENV=test) on a
  # migrated native PostgreSQL.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LAE_DATABASE_URL: postgresql+asyncpg://lae:lae@localhost:5432/lae_e2e
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: PostgreSQL
        uses: ./.github/actions/setup-postgres
        with:
          database: lae_e2e

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: uv sync
        working-directory: backend
        run: uv sync --locked

      - name: Migrate the e2e database
        working-directory: backend
        run: uv run --locked lae migrate

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Locate the pnpm store
        run: echo "PNPM_STORE=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: pnpm install
        run: corepack pnpm install --frozen-lockfile

      - name: Read the Playwright version
        run: echo "PLAYWRIGHT_VERSION=$(corepack pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}-chromium

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: corepack pnpm exec playwright install --with-deps --only-shell chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: corepack pnpm exec playwright install-deps chromium

      - name: build
        run: corepack pnpm build

      - name: Playwright + axe
        run: corepack pnpm test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  config:
    name: config
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.11.19"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          cache-python: true

      - name: Validate profiles/ against their JSON schemas
        run: uv run --locked --project backend python scripts/validate_profiles.py

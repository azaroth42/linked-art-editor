# yaml-language-server: $schema=_schema.json
# UI Profile for Place. Path syntax and the per-widget path contract are in profiles/README.md;
# property names follow the Linked Art model (linked.art docs/model/place/).
class: Place
version: 1
sections:
  - id: identification
    label:
      en: Identification
    slots:
      - id: names
        label:
          en: Names
        help_text:
          en: Names of the place. Mark the main name in each language as the Primary Name.
        path: identified_by[Name]
        widget: langtext
        multiple: true
        required: true
        advanced: false
      - id: identifiers
        label:
          en: Identifiers
        help_text:
          en: Identifiers assigned to the place, such as gazetteer numbers.
        path: identified_by[Identifier]
        widget: identifier
        value_set: vocab:identifier_types
        multiple: true
        required: false
        advanced: false
  - id: location
    label:
      en: Location
    slots:
      - id: part_of
        label:
          en: Part Of
        help_text:
          en: Larger places this place is within, for example the city a building is in.
        path: part_of
        widget: entity_ref
        allowed_classes: [Place]
        multiple: true
        required: false
        advanced: false
  - id: geometry
    label:
      en: Geometry
    advanced: true
    slots:
      - id: boundary
        label:
          en: Boundary
        help_text:
          en: "The place's location or extent as Well-Known Text, for example POINT(4.88 52.36)."
        path: defined_by
        widget: wkt
        multiple: false
        required: false
        advanced: false
  - id: about
    label:
      en: Description
    slots:
      - id: description
        label:
          en: Description
        help_text:
          en: Descriptions and other statements about the place, each with a statement type.
        path: referred_to_by[LinguisticObject]
        widget: statement
        value_set: vocab:statement_types
        multiple: true
        required: false
        advanced: false
grid_columns:
  - slot: names
  - slot: part_of

# Reference local infrastructure. Step 0.1 placeholder: Postgres only.
# Step 0.3 adds qlever, qlever-public, api, crdt-ws, sync-worker, scheduler, and the `ai` profile.
name: lae

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lae
      POSTGRES_PASSWORD: lae
      POSTGRES_DB: lae
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lae -d lae"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

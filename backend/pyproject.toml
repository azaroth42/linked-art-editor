[project]
name = "lae"
version = "0.1.0"
description = "Laertes backend (Laertes with Real Time Entity Synchronization)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.10",
    "babel>=2.18.0",
    "fastapi>=0.165.0",
    "httpx[http2]>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "orjson>=3.13.0",
    # pycrdt and pycrdt-websocket are pinned together (conventions §4); bump both at once.
    "pycrdt==0.14.13",
    "pycrdt-websocket==0.16.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyld>=3.3.0",
    "pyoxigraph>=0.5.13",
    "pyshacl>=0.40.2",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "referencing>=0.37.0",
    "sqlalchemy[asyncio]>=2",
    "structlog>=26.1.0",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[project.scripts]
lae = "lae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lae"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Authlib ships neither type hints nor stubs (lae.auth.oidc).
module = ["authlib", "authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# asyncpg ships neither type hints nor stubs (lae.bootstrap uses it for COPY).
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres or QLever (see docs/agent-workflow.md)",
]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261122",
    # WebSocket client for tests/crdt (the server side comes with uvicorn[standard]).
    "websockets>=17.4",
]
spike = [
    "psutil>=7.2.2",
    "websockets>=17.4",
]

[[tool.mypy.overrides]]
module = ["pyld.*"]
ignore_missing_imports = true

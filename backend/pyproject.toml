[project]
name = "lae"
version = "0.1.0"
description = "Collaborative Linked Art Editor backend"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "authlib>=1.9.10",
    "fastapi>=0.165.0",
    "httpx[http2]>=0.28.1",
    "jsonschema>=4.26.0",
    "orjson>=3.13.0",
    # pycrdt and pycrdt-websocket are pinned together (conventions §4); bump both at once.
    "pycrdt==0.14.13",
    "pycrdt-websocket==0.16.9",
    "pydantic>=2",
    "pydantic-settings>=2.16.3",
    "pyld>=3.3.0",
    "pyoxigraph>=0.5.13",
    "pyshacl>=0.40.2",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
    "zstandard>=0.25.0",
]

[project.scripts]
lae = "lae.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lae"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs a running Postgres or QLever (see docs/agent-workflow.md)",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "testcontainers[postgres]>=4.15.0",
]

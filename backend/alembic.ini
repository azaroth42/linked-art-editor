# Alembic configuration for the lae database. Run from backend/: `uv run alembic upgrade head`
# (or `uv run lae migrate`). The database URL is not set here: migrations/env.py reads
# LAE_DATABASE_URL through lae.settings (conventions §2).

[alembic]
script_location = %(here)s/migrations
# Migration files are numbered by phase (conventions §3): 0001_core.py, 0002_auth_seed.py, ...
# Create one with: uv run alembic revision --rev-id 0002 -m "auth seed"
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
